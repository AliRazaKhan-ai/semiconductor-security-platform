name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Yosys and Verilator are apt-installable, so the reference-differential
      # netlist analysis runs on every push. Fabric and Anvil are not available
      # to a hosted runner, so the one test that needs a live ledger is
      # deselected below rather than silently skipped.
      - name: Install EDA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys verilator
          yosys -V
          verilator --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch first: requirements.txt says torch>=2.4,<3, which on a runner
          # resolves to the CUDA build and about 2.5 GB of NVIDIA libraries it cannot use.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # pytest is not in requirements.txt, which lists runtime dependencies only.
          # Without it the Test step failed immediately with 'No module named pytest'.
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests terminal
        continue-on-error: true

      - name: Type check
        run: mypy app
        continue-on-error: true

      - name: Compile
        run: |
          python -m compileall -q app terminal
          python -m py_compile manage.py run.py wsgi.py

      - name: Test
        env:
          SEMISURE_ENV: test
          SEMISURE_PUF_MASTER_SECRET: ci-only-master-secret-not-a-real-key-000000
          SEMISURE_OPENTITAN_VERIFICATION_KEY: ci-only-verification-key-not-real-00000
          # Anvil's default account #0 key, printed by every Foundry install and used by
          # the local development chain. Public, holds nothing, exists on no real network.
          # Without it the blockchain service refuses to construct, readiness reports
          # degraded, and seven tests fail.
          SEMISURE_ETHEREUM_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
        run: |
          python -m pytest -q \
            --deselect tests/integration/test_complete_module_integration.py::test_good_chip_complete_integration
